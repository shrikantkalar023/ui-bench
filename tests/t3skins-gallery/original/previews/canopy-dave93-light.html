<!DOCTYPE html>
<html lang="en" class="" data-theme-id="preview" data-theme-selected="true" style="--app-theme-canvas:#f3f6ec;--app-theme-chrome:#f3f6ec;--app-theme-toolbar:#f3f6ec;--app-theme-toolbar-foreground:#1d2b16;--app-theme-toolbar-border:#d5dfc8;--app-theme-toolbar-control:#fdfdf8;--app-theme-toolbar-control-foreground:#1d2b16;--app-theme-toolbar-control-hover:#e6ecdc;--app-theme-surface:#fdfdf8;--app-theme-surface-raised:#f8faf3;--app-theme-surface-overlay:#fdfdf8;--app-theme-text:#1d2b16;--app-theme-text-muted:#55664b;--app-theme-border:#d5dfc8;--app-theme-input:#c3cfb3;--app-theme-focus:#3d6b1f;--app-theme-accent:#3d6b1f;--app-theme-accent-foreground:#ffffff;--app-theme-secondary:#e9efe0;--app-theme-secondary-foreground:#1d2b16;--app-theme-muted:#e9efe0;--app-theme-muted-foreground:#55664b;--app-theme-placeholder:#708266;--app-theme-secondary-label:#55664b;--app-theme-icon-muted:#66785c;--app-theme-error:#c0392b;--app-theme-error-foreground:#a12d21;--app-theme-error-surface:#f8e3df;--app-theme-warning:#c98a12;--app-theme-warning-foreground:#855a07;--app-theme-warning-surface:#f7eed8;--app-theme-update:#3d6b1f;--app-theme-update-foreground:#3d6b1f;--app-theme-update-surface:#e2ecd5;--app-theme-accent-surface:#e2ecd5;--app-theme-accent-surface-foreground:#2a4a14;--app-theme-message-surface:#e4eed8;--app-theme-message-foreground:#1d2b16;--app-theme-message-action:#3d6b1f;--app-theme-message-action-foreground:#ffffff;--app-theme-message-action-hover:#335a19;--app-theme-code-background:#eef2e6;--app-theme-code-foreground:#1d2b16;--app-theme-search-match-background:#ffde8b;--app-theme-search-match-foreground:#21180a;--app-theme-search-match-active-background:#eea52b;--app-theme-search-match-active-foreground:#21180a;--app-theme-sidebar:#e9efe0;--app-theme-sidebar-foreground:#1d2b16;--app-theme-sidebar-muted-foreground:#55664b;--app-theme-sidebar-control-surface:#dfe7d3;--app-theme-sidebar-row-hover:#dfe7d3;--app-theme-sidebar-row-active:#d5dfc8;--app-theme-sidebar-row-selected:#fdfdf8;--app-theme-sidebar-border:#d5dfc8;--app-theme-terminal-background:#f3f6ec;--app-theme-terminal-foreground:#1d2b16;--app-theme-terminal-cursor:#3d6b1f;--app-theme-terminal-selection:#d3e3c2;--app-theme-terminal-scrollbar:#d5dfc8;--app-theme-terminal-scrollbar-hover:#c3cfb3;color-scheme:light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Canopy preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--app-theme-canvas,#111);color:var(--app-theme-text,#eee);
  font:12px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
.shell{display:grid;grid-template-columns:124px 1fr;height:100%;min-height:100%;
  background:var(--app-theme-canvas,#111);color:var(--app-theme-text,#eee)}
[data-slot="sidebar-wrapper"],[data-slot="sidebar"]{
  background:var(--app-theme-sidebar,var(--app-theme-chrome,#0c0c0e));
  color:var(--app-theme-sidebar-foreground,var(--app-theme-text,#eee));
  border-right:1px solid var(--app-theme-sidebar-border,var(--app-theme-border,#222));
  padding:10px 8px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
[data-slot="sidebar-inner"]{display:flex;flex-direction:column;gap:6px;min-height:0}
.brand{display:flex;align-items:center;gap:6px;font-weight:650;letter-spacing:-.02em}
[data-slot="project-monogram"]{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;
  background:var(--app-theme-accent,#7aa2f7);color:var(--app-theme-accent-foreground,#111);font-size:9px;font-weight:700}
[data-thread-item],[data-testid="sidebar-row-card"],[data-sidebar-row]{
  padding:6px 8px;border-radius:8px;color:var(--app-theme-sidebar-muted-foreground,var(--app-theme-muted-foreground,#9a9));
  background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-thread-item].on,[data-sidebar-row].on{
  background:var(--app-theme-sidebar-row-active,var(--app-theme-sidebar-row-selected,var(--app-theme-muted,#222)));
  color:var(--app-theme-sidebar-foreground,var(--app-theme-text))}
[data-workspace-area="conversation"],[data-chat-column]{
  display:flex;flex-direction:column;min-width:0;height:100%;
  background:var(--app-theme-canvas,#111);position:relative}
[data-chat-header]{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid var(--app-theme-toolbar-border,var(--app-theme-border,#222));
  background:var(--app-theme-toolbar,transparent);color:var(--app-theme-toolbar-foreground,var(--app-theme-text));
  position:relative;z-index:2}
.msgs{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;min-height:0}
[data-message-role="assistant"]{max-width:86%;color:var(--app-theme-text);opacity:.95}
[data-user-message-bubble]{align-self:flex-end;max-width:78%;padding:7px 10px;border-radius:12px 12px 4px 12px;
  background:var(--app-theme-message-surface,var(--app-theme-surface,#222));
  color:var(--app-theme-message-foreground,var(--app-theme-text))}
code,pre{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--app-theme-code-background,var(--app-theme-surface,#1a1a1a));
  color:var(--app-theme-code-foreground,var(--app-theme-text));border-radius:6px;padding:1px 4px}
[data-slot="composer-host"],[data-chat-composer-form],[data-slot="composer-shell"]{
  margin:8px;padding:8px 10px;border:1px solid var(--app-theme-border,#222);
  border-radius:12px;background:var(--app-theme-surface,var(--app-theme-input,#1a1a1a));
  display:flex;align-items:center;gap:8px;position:relative;z-index:2}
[data-slot="input"],[data-chat-composer-main-surface]{flex:1;color:var(--app-theme-placeholder,var(--app-theme-text-muted,#888));}
[data-slot="button"]{border:0;border-radius:8px;padding:5px 10px;cursor:default;font-weight:650;
  background:var(--app-theme-message-action,var(--app-theme-accent,#7aa2f7));
  color:var(--app-theme-message-action-foreground,var(--app-theme-accent-foreground,#111))}
.dot{width:6px;height:6px;border-radius:99px;background:var(--app-theme-accent);display:inline-block}

html,body{background:#f3f6ec}
/* Canopy: pebble-soft shapes, a leaf-shaped user bubble, dappled light behind the chat. */
[data-slot="composer-host"] { border-radius: 22px !important; }
[data-user-message-bubble] { border-radius: 20px 20px 6px 20px !important; }
.chat-markdown-codeblock { border-radius: 14px !important; }
[data-thread-item] { border-radius: 14px !important; }
[data-slot="popover-popup"], [data-slot="menu-popup"], [data-slot="dialog-popup"], [data-thread-details-card] { border-radius: 18px !important; }

/* Morning: warm sun patches falling through leaves. */
:root:not(.dark) [data-workspace-area="conversation"] {
  background-image:
    radial-gradient(ellipse 520px 360px at 10% 6%, rgba(255, 220, 120, 0.55), transparent 70%),
    radial-gradient(ellipse 420px 300px at 92% 28%, rgba(255, 228, 140, 0.45), transparent 70%),
    radial-gradient(ellipse 620px 380px at 72% 96%, rgba(150, 195, 110, 0.32), transparent 70%),
    radial-gradient(ellipse 360px 260px at 4% 62%, rgba(255, 226, 140, 0.40), transparent 70%) !important;
}

/* Night: fireflies in the side margins (clear of the text column) and a little moonlight from the top. */
.dark [data-workspace-area="conversation"] {
  background-image:
    radial-gradient(circle at 5% 18%, rgba(250, 225, 120, 0.95) 0 2px, rgba(245, 215, 110, 0.22) 4px, rgba(245, 215, 110, 0.06) 10px, transparent 18px),
    radial-gradient(circle at 8% 41%, rgba(250, 225, 120, 0.80) 0 1.5px, rgba(245, 215, 110, 0.18) 4px, rgba(245, 215, 110, 0.05) 9px, transparent 16px),
    radial-gradient(circle at 7% 66%, rgba(250, 225, 120, 0.90) 0 2px, rgba(245, 215, 110, 0.20) 4px, rgba(245, 215, 110, 0.06) 10px, transparent 18px),
    radial-gradient(circle at 3% 90%, rgba(250, 225, 120, 0.70) 0 1.5px, rgba(245, 215, 110, 0.16) 4px, rgba(245, 215, 110, 0.05) 9px, transparent 15px),
    radial-gradient(circle at 92% 9%, rgba(250, 225, 120, 0.85) 0 1.5px, rgba(245, 215, 110, 0.18) 4px, rgba(245, 215, 110, 0.05) 9px, transparent 16px),
    radial-gradient(circle at 88% 34%, rgba(250, 225, 120, 0.95) 0 2px, rgba(245, 215, 110, 0.22) 4px, rgba(245, 215, 110, 0.06) 10px, transparent 18px),
    radial-gradient(circle at 96% 58%, rgba(250, 225, 120, 0.75) 0 1.5px, rgba(245, 215, 110, 0.16) 4px, rgba(245, 215, 110, 0.05) 9px, transparent 15px),
    radial-gradient(circle at 86% 82%, rgba(250, 225, 120, 0.90) 0 2px, rgba(245, 215, 110, 0.20) 4px, rgba(245, 215, 110, 0.06) 10px, transparent 18px),
    radial-gradient(ellipse 900px 380px at 50% -10%, rgba(198, 241, 157, 0.07), transparent 70%) !important;
}

/* Links and "Working" in stream blue, apart from the green "Done". */
:root:not(.dark) { --info: #235b80 !important; --info-foreground: #235b80 !important; }
.dark { --info: #8ec9e8 !important; --info-foreground: #8ec9e8 !important; }
:root:not(.dark) ::selection { background: #d3e3c2; color: #1d2b16; }
.dark ::selection { background: #3a5a2c; color: #f2f8ec; }
</style>
</head>
<body class="">
<div class="shell" data-chat-canvas data-chat-column>
  <aside data-slot="sidebar-wrapper" data-slot="sidebar">
    <div data-slot="sidebar-inner">
      <div class="brand"><span data-slot="project-monogram">T3</span> Code</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row class="on">Canopy</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row>Appearance</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row>Fix HTTPS</div>
    </div>
  </aside>
  <main data-workspace-area="conversation" data-chat-column>
    <header data-chat-header>
      <span>Canopy</span>
      <span data-chat-provider-model-picker data-model-picker-content>Opus 5.5 <span class="dot"></span></span>
    </header>
    <div class="msgs">
      <div data-message-role="assistant">This is a live mock of T3 Code wearing <strong>Canopy</strong>. Animated CSS in the skin should play here.</div>
      <div data-user-message-bubble>Restyle the app and keep the sidebar readable.</div>
      <div data-message-role="assistant">Done. Palette plus custom CSS are applied. Try <code>Settings → Appearance → Add</code>.</div>
    </div>
    <form data-chat-composer-form data-slot="composer-host" data-slot="composer-shell">
      <div data-slot="input" data-chat-composer-main-surface>Ask T3 Code…</div>
      <button type="button" data-slot="button">Send</button>
    </form>
  </main>
</div>
</body>
</html>

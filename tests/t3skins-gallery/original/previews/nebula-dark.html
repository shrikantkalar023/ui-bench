<!DOCTYPE html>
<html lang="en" class="dark" data-theme-id="preview" data-theme-selected="true" style="--app-theme-focus:#b86bd6;--app-theme-sidebar:#160a18;--app-theme-message-action:#a0309f;--app-theme-message-action-hover:#b8389f;--app-theme-message-action-foreground:#ffffff;--app-theme-canvas:#0b060d;--app-theme-accent:#d1458f;color-scheme:dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nebula preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--app-theme-canvas,#111);color:var(--app-theme-text,#eee);
  font:12px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
.shell{display:grid;grid-template-columns:124px 1fr;height:100%;min-height:100%;
  background:var(--app-theme-canvas,#111);color:var(--app-theme-text,#eee)}
[data-slot="sidebar-wrapper"],[data-slot="sidebar"]{
  background:var(--app-theme-sidebar,var(--app-theme-chrome,#0c0c0e));
  color:var(--app-theme-sidebar-foreground,var(--app-theme-text,#eee));
  border-right:1px solid var(--app-theme-sidebar-border,var(--app-theme-border,#222));
  padding:10px 8px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
[data-slot="sidebar-inner"]{display:flex;flex-direction:column;gap:6px;min-height:0}
.brand{display:flex;align-items:center;gap:6px;font-weight:650;letter-spacing:-.02em}
[data-slot="project-monogram"]{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;
  background:var(--app-theme-accent,#7aa2f7);color:var(--app-theme-accent-foreground,#111);font-size:9px;font-weight:700}
[data-thread-item],[data-testid="sidebar-row-card"],[data-sidebar-row]{
  padding:6px 8px;border-radius:8px;color:var(--app-theme-sidebar-muted-foreground,var(--app-theme-muted-foreground,#9a9));
  background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-thread-item].on,[data-sidebar-row].on{
  background:var(--app-theme-sidebar-row-active,var(--app-theme-sidebar-row-selected,var(--app-theme-muted,#222)));
  color:var(--app-theme-sidebar-foreground,var(--app-theme-text))}
[data-workspace-area="conversation"],[data-chat-column]{
  display:flex;flex-direction:column;min-width:0;height:100%;
  background:var(--app-theme-canvas,#111);position:relative}
[data-chat-header]{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid var(--app-theme-toolbar-border,var(--app-theme-border,#222));
  background:var(--app-theme-toolbar,transparent);color:var(--app-theme-toolbar-foreground,var(--app-theme-text));
  position:relative;z-index:2}
.msgs{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;min-height:0}
[data-message-role="assistant"]{max-width:86%;color:var(--app-theme-text);opacity:.95}
[data-user-message-bubble]{align-self:flex-end;max-width:78%;padding:7px 10px;border-radius:12px 12px 4px 12px;
  background:var(--app-theme-message-surface,var(--app-theme-surface,#222));
  color:var(--app-theme-message-foreground,var(--app-theme-text))}
code,pre{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--app-theme-code-background,var(--app-theme-surface,#1a1a1a));
  color:var(--app-theme-code-foreground,var(--app-theme-text));border-radius:6px;padding:1px 4px}
[data-slot="composer-host"],[data-chat-composer-form],[data-slot="composer-shell"]{
  margin:8px;padding:8px 10px;border:1px solid var(--app-theme-border,#222);
  border-radius:12px;background:var(--app-theme-surface,var(--app-theme-input,#1a1a1a));
  display:flex;align-items:center;gap:8px;position:relative;z-index:2}
[data-slot="input"],[data-chat-composer-main-surface]{flex:1;color:var(--app-theme-placeholder,var(--app-theme-text-muted,#888));}
[data-slot="button"]{border:0;border-radius:8px;padding:5px 10px;cursor:default;font-weight:650;
  background:var(--app-theme-message-action,var(--app-theme-accent,#7aa2f7));
  color:var(--app-theme-message-action-foreground,var(--app-theme-accent-foreground,#111))}
.dot{width:6px;height:6px;border-radius:99px;background:var(--app-theme-accent);display:inline-block}

html,body{background:#0b060d}
@property --n1x{syntax:'<percentage>';inherits:false;initial-value:50%}
@property --n1y{syntax:'<percentage>';inherits:false;initial-value:50%}
@property --n2x{syntax:'<percentage>';inherits:false;initial-value:50%}
@property --n2y{syntax:'<percentage>';inherits:false;initial-value:50%}
@property --n3x{syntax:'<percentage>';inherits:false;initial-value:50%}
@property --n3y{syntax:'<percentage>';inherits:false;initial-value:50%}
@property --n4x{syntax:'<percentage>';inherits:false;initial-value:50%}
@property --n4y{syntax:'<percentage>';inherits:false;initial-value:50%}
@property --n5x{syntax:'<percentage>';inherits:false;initial-value:50%}
@property --n5y{syntax:'<percentage>';inherits:false;initial-value:50%}
@property --n1s{syntax:'<percentage>';inherits:false;initial-value:160%}
@property --n3s{syntax:'<percentage>';inherits:false;initial-value:160%}
@property --n4s{syntax:'<percentage>';inherits:false;initial-value:160%}
[data-chat-canvas]{background-image:radial-gradient(rgba(0,0,0,.28) 1px,transparent 1.6px),radial-gradient(ellipse 31% 26% at 51% 31%,rgba(44,66,200,0.75),rgba(44,66,200,0.34) 45%,transparent 100%),radial-gradient(ellipse 28% 21% at 50% 72%,rgba(210,140,50,0.62),rgba(210,140,50,0.28) 45%,transparent 100%),radial-gradient(ellipse 42% 32% at 50% 56%,rgba(140,28,124,0.62),rgba(140,28,124,0.28) 45%,transparent 100%),radial-gradient(ellipse 16% 32% at 81% 60%,rgba(222,20,64,0.78),rgba(222,20,64,0.35) 45%,transparent 100%),radial-gradient(ellipse 13% 26% at 19% 64%,rgba(190,20,70,0.45),rgba(190,20,70,0.2) 45%,transparent 100%),radial-gradient(ellipse 70% 45% at 50% 100%,rgba(70,16,60,0.7),rgba(70,16,60,0.32) 45%,transparent 100%)!important;background-color:#0b060d!important;background-size:7px 7px,var(--n1s) var(--n1s),160% 160%,var(--n3s) var(--n3s),var(--n4s) var(--n4s),160% 160%,100% 100%!important;background-repeat:repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat!important;background-position:0 0,var(--n1x) var(--n1y),var(--n2x) var(--n2y),var(--n3x) var(--n3y),var(--n4x) var(--n4y),var(--n5x) var(--n5y),0 0;animation:nb1x 17s ease-in-out -5.6s infinite alternate,nb1y 23s ease-in-out -19.3s infinite alternate,nb2x 29s ease-in-out -13.3s infinite alternate,nb2y 19s ease-in-out -2.5s infinite alternate,nb3x 31s ease-in-out -18.3s infinite alternate,nb3y 37s ease-in-out -15.5s infinite alternate,nb4x 13s ease-in-out -9.4s infinite alternate,nb4y 41s ease-in-out -29.1s infinite alternate,nb5x 43s ease-in-out -36.6s infinite alternate,nb5y 47s ease-in-out -0.0s infinite alternate,nb1s 53s ease-in-out -21.2s infinite alternate,nb3s 59s ease-in-out -23.6s infinite alternate,nb4s 61s ease-in-out -24.4s infinite alternate}
@keyframes nb1x{from{--n1x:20%}to{--n1x:80%}}
@keyframes nb1y{from{--n1y:25%}to{--n1y:75%}}
@keyframes nb2x{from{--n2x:25%}to{--n2x:78%}}
@keyframes nb2y{from{--n2y:25%}to{--n2y:75%}}
@keyframes nb3x{from{--n3x:22%}to{--n3x:78%}}
@keyframes nb3y{from{--n3y:28%}to{--n3y:80%}}
@keyframes nb4x{from{--n4x:15%}to{--n4x:85%}}
@keyframes nb4y{from{--n4y:20%}to{--n4y:80%}}
@keyframes nb5x{from{--n5x:30%}to{--n5x:70%}}
@keyframes nb5y{from{--n5y:22%}to{--n5y:78%}}
@keyframes nb1s{from{--n1s:140%}to{--n1s:185%}}
@keyframes nb3s{from{--n3s:135%}to{--n3s:180%}}
@keyframes nb4s{from{--n4s:145%}to{--n4s:190%}}
[data-workspace-area="conversation"],.messages-timeline-scroll,[data-chat-header]{background:transparent!important}
[data-chat-header]{border-bottom:0!important}
[data-slot="sidebar-inner"]{background:linear-gradient(180deg,rgba(30,16,34,.92),rgba(22,10,24,.94))!important;border:1px solid rgba(255,255,255,.07)!important;border-radius:20px!important;box-shadow:0 20px 60px rgba(0,0,0,.45)}
[data-thread-item]{border-radius:10px!important}
[data-slot="composer-host"]{background:rgba(22,12,24,.62)!important;backdrop-filter:blur(22px) saturate(140%);animation:nbGlow 16s linear infinite}
@keyframes nbGlow{0%,100%{box-shadow:0 0 34px rgba(70,90,230,.18),0 18px 50px rgba(0,0,0,.45)}25%{box-shadow:0 0 34px rgba(170,40,170,.18),0 18px 50px rgba(0,0,0,.45)}50%{box-shadow:0 0 34px rgba(220,30,70,.18),0 18px 50px rgba(0,0,0,.45)}75%{box-shadow:0 0 34px rgba(210,140,50,.17),0 18px 50px rgba(0,0,0,.45)}}
[data-slot="composer-host"]::after{animation:nbEdge 16s linear infinite}
@keyframes nbEdge{0%,100%{border-color:rgba(90,110,255,.4)}25%{border-color:rgba(190,60,200,.42)}50%{border-color:rgba(240,50,90,.42)}75%{border-color:rgba(230,160,70,.42)}}
[data-chat-composer-form] :is(button[type="submit"],button.bg-message-action){background-image:linear-gradient(135deg,#3f55e0,#a0309f 38%,#e0204f 68%,#e8a040)!important;background-size:240% 240%!important;background-position:0 50%;color:#fff!important;box-shadow:0 0 16px rgba(200,50,140,.4)!important;animation:nbBtn 7s ease-in-out infinite alternate}
[data-chat-composer-form] :is(button[type="submit"],button.bg-message-action):disabled{opacity:.5;box-shadow:none!important}
@keyframes nbBtn{to{background-position:100% 50%}}
[data-user-message-bubble]{background:rgba(255,255,255,.08)!important;border:1px solid rgba(255,255,255,.08)!important;backdrop-filter:blur(16px)}
.chat-markdown-codeblock{background:rgba(10,5,12,.7)!important;border:1px solid rgba(255,255,255,.08)!important;backdrop-filter:blur(12px)}
[data-slot="dialog-popup"],[data-slot="popover-popup"],[data-slot="menu-popup"]{background:rgba(26,14,28,.92)!important;backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.09)!important}
::selection{background:rgba(196,80,160,.4)}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-right:3px solid transparent;background-clip:padding-box;border-radius:9px}
@media (prefers-reduced-motion:reduce){[data-chat-canvas],[data-slot="composer-host"],[data-slot="composer-host"]::after,[data-chat-composer-form] button{animation:none!important}}
</style>
</head>
<body class="dark">
<div class="shell" data-chat-canvas data-chat-column>
  <aside data-slot="sidebar-wrapper" data-slot="sidebar">
    <div data-slot="sidebar-inner">
      <div class="brand"><span data-slot="project-monogram">T3</span> Code</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row class="on">Nebula</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row>Appearance</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row>Fix HTTPS</div>
    </div>
  </aside>
  <main data-workspace-area="conversation" data-chat-column>
    <header data-chat-header>
      <span>Nebula</span>
      <span data-chat-provider-model-picker data-model-picker-content>Opus 5.5 <span class="dot"></span></span>
    </header>
    <div class="msgs">
      <div data-message-role="assistant">This is a live mock of T3 Code wearing <strong>Nebula</strong>. Animated CSS in the skin should play here.</div>
      <div data-user-message-bubble>Restyle the app and keep the sidebar readable.</div>
      <div data-message-role="assistant">Done. Palette plus custom CSS are applied. Try <code>Settings → Appearance → Add</code>.</div>
    </div>
    <form data-chat-composer-form data-slot="composer-host" data-slot="composer-shell">
      <div data-slot="input" data-chat-composer-main-surface>Ask T3 Code…</div>
      <button type="button" data-slot="button">Send</button>
    </form>
  </main>
</div>
</body>
</html>

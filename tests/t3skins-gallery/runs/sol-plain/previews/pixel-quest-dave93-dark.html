<!DOCTYPE html>
<html lang="en" class="dark" data-theme-id="preview" data-theme-selected="true" style="--app-theme-canvas:#1a1c2c;--app-theme-chrome:#1a1c2c;--app-theme-toolbar:#1a1c2c;--app-theme-toolbar-foreground:#f4f4f4;--app-theme-toolbar-border:#333c57;--app-theme-toolbar-control:#22263a;--app-theme-toolbar-control-foreground:#f4f4f4;--app-theme-toolbar-control-hover:#2a3048;--app-theme-surface:#22263a;--app-theme-surface-raised:#262b44;--app-theme-surface-overlay:#262b44;--app-theme-text:#f4f4f4;--app-theme-text-muted:#94b0c2;--app-theme-border:#333c57;--app-theme-input:#566c86;--app-theme-focus:#ffcd75;--app-theme-accent:#ffcd75;--app-theme-accent-foreground:#1a1c2c;--app-theme-secondary:#262b44;--app-theme-secondary-foreground:#f4f4f4;--app-theme-muted:#262b44;--app-theme-muted-foreground:#94b0c2;--app-theme-placeholder:#8199b0;--app-theme-secondary-label:#94b0c2;--app-theme-icon-muted:#94b0c2;--app-theme-error:#e0566c;--app-theme-error-foreground:#ff8a9b;--app-theme-error-surface:#3a2034;--app-theme-warning:#ef7d57;--app-theme-warning-foreground:#ffa37f;--app-theme-warning-surface:#3a2a2a;--app-theme-update:#73eff7;--app-theme-update-foreground:#73eff7;--app-theme-update-surface:#1f3446;--app-theme-accent-surface:#29366f;--app-theme-accent-surface-foreground:#ffe6a8;--app-theme-message-surface:#29366f;--app-theme-message-foreground:#f4f4f4;--app-theme-message-action:#ffcd75;--app-theme-message-action-foreground:#1a1c2c;--app-theme-message-action-hover:#ffdc99;--app-theme-code-background:#141522;--app-theme-code-foreground:#f4f4f4;--app-theme-search-match-background:#8c6c1f;--app-theme-search-match-foreground:#f5f5f5;--app-theme-search-match-active-background:#eea52b;--app-theme-search-match-active-foreground:#21180a;--app-theme-sidebar:#141522;--app-theme-sidebar-foreground:#f4f4f4;--app-theme-sidebar-muted-foreground:#94b0c2;--app-theme-sidebar-control-surface:#1a1c2c;--app-theme-sidebar-row-hover:#22263a;--app-theme-sidebar-row-active:#29366f;--app-theme-sidebar-row-selected:#262b44;--app-theme-sidebar-border:#333c57;--app-theme-terminal-background:#141522;--app-theme-terminal-foreground:#f4f4f4;--app-theme-terminal-cursor:#a7f070;--app-theme-terminal-selection:#333c57;--app-theme-terminal-scrollbar:#333c57;--app-theme-terminal-scrollbar-hover:#566c86;color-scheme:dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pixel Quest preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--app-theme-canvas,#111);color:var(--app-theme-text,#eee);
  font:12px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
.shell{display:grid;grid-template-columns:124px 1fr;height:100%;min-height:100%;
  background:var(--app-theme-canvas,#111);color:var(--app-theme-text,#eee)}
[data-slot="sidebar-wrapper"],[data-slot="sidebar"]{
  background:var(--app-theme-sidebar,var(--app-theme-chrome,#0c0c0e));
  color:var(--app-theme-sidebar-foreground,var(--app-theme-text,#eee));
  border-right:1px solid var(--app-theme-sidebar-border,var(--app-theme-border,#222));
  padding:10px 8px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
[data-slot="sidebar-inner"]{display:flex;flex-direction:column;gap:6px;min-height:0}
.brand{display:flex;align-items:center;gap:6px;font-weight:650;letter-spacing:-.02em}
[data-slot="project-monogram"]{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;
  background:var(--app-theme-accent,#7aa2f7);color:var(--app-theme-accent-foreground,#111);font-size:9px;font-weight:700}
[data-thread-item],[data-testid="sidebar-row-card"],[data-sidebar-row]{
  padding:6px 8px;border-radius:8px;color:var(--app-theme-sidebar-muted-foreground,var(--app-theme-muted-foreground,#9a9));
  background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-thread-item].on,[data-sidebar-row].on{
  background:var(--app-theme-sidebar-row-active,var(--app-theme-sidebar-row-selected,var(--app-theme-muted,#222)));
  color:var(--app-theme-sidebar-foreground,var(--app-theme-text))}
[data-workspace-area="conversation"],[data-chat-column]{
  display:flex;flex-direction:column;min-width:0;height:100%;
  background:var(--app-theme-canvas,#111);position:relative}
[data-chat-header]{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid var(--app-theme-toolbar-border,var(--app-theme-border,#222));
  background:var(--app-theme-toolbar,transparent);color:var(--app-theme-toolbar-foreground,var(--app-theme-text));
  position:relative;z-index:2}
.msgs{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;min-height:0}
[data-message-role="assistant"]{max-width:86%;color:var(--app-theme-text);opacity:.95}
[data-user-message-bubble]{align-self:flex-end;max-width:78%;padding:7px 10px;border-radius:12px 12px 4px 12px;
  background:var(--app-theme-message-surface,var(--app-theme-surface,#222));
  color:var(--app-theme-message-foreground,var(--app-theme-text))}
code,pre{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--app-theme-code-background,var(--app-theme-surface,#1a1a1a));
  color:var(--app-theme-code-foreground,var(--app-theme-text));border-radius:6px;padding:1px 4px}
[data-slot="composer-host"],[data-chat-composer-form],[data-slot="composer-shell"]{
  margin:8px;padding:8px 10px;border:1px solid var(--app-theme-border,#222);
  border-radius:12px;background:var(--app-theme-surface,var(--app-theme-input,#1a1a1a));
  display:flex;align-items:center;gap:8px;position:relative;z-index:2}
[data-slot="input"],[data-chat-composer-main-surface]{flex:1;color:var(--app-theme-placeholder,var(--app-theme-text-muted,#888));}
[data-slot="button"]{border:0;border-radius:8px;padding:5px 10px;cursor:default;font-weight:650;
  background:var(--app-theme-message-action,var(--app-theme-accent,#7aa2f7));
  color:var(--app-theme-message-action-foreground,var(--app-theme-accent-foreground,#111))}
.dot{width:6px;height:6px;border-radius:99px;background:var(--app-theme-accent);display:inline-block}

html,body{background:#1a1c2c}
/* Pixel Quest: square corners, 2px frames and hard pixel shadows, like an 8-bit RPG dialog box. */
[data-slot="composer-host"], [data-user-message-bubble], .chat-markdown-codeblock, [data-thread-item],
[data-slot="button"], [data-slot="input"], [data-slot="select-trigger"], [data-slot="popover-popup"],
[data-slot="menu-popup"], [data-slot="dialog-popup"], [data-slot="tooltip-popup"], [data-thread-details-card] {
  border-radius: 0 !important;
}

:root:not(.dark) [data-slot="composer-host"] { border: 2px solid #1a1c2c !important; box-shadow: 4px 4px 0 0 #1a1c2c !important; }
.dark [data-slot="composer-host"] { border: 2px solid #94b0c2 !important; box-shadow: 4px 4px 0 0 #07080f !important; }
:root:not(.dark) [data-user-message-bubble] { border: 2px solid #1a1c2c; box-shadow: 3px 3px 0 0 #1a1c2c; }
.dark [data-user-message-bubble] { border: 2px solid #f4f4f4; box-shadow: 3px 3px 0 0 #07080f; }
:root:not(.dark) .chat-markdown-codeblock { border: 2px solid #94b0c2 !important; }
.dark .chat-markdown-codeblock { border: 2px solid #333c57 !important; }
:root:not(.dark) [data-thread-details-card] { border: 2px solid #c5d2dd !important; box-shadow: 3px 3px 0 0 #c5d2dd !important; }
.dark [data-thread-details-card] { border: 2px solid #333c57 !important; box-shadow: 3px 3px 0 0 #07080f !important; }

/* Pixel lettering and chunky square-capped icons. */
[data-slot="sidebar"], [data-chat-header], .chat-markdown :is(h1, h2, h3) { font-family: var(--font-mono, ui-monospace, monospace); }
.chat-markdown :is(h1, h2, h3) { text-transform: uppercase; letter-spacing: 0.04em; }
svg.lucide { stroke-width: 2.25; stroke-linecap: square; stroke-linejoin: miter; }

/* An 8px pixel lattice behind the chat. */
:root:not(.dark) [data-workspace-area="conversation"] {
  background-image: radial-gradient(rgba(41, 54, 111, 0.13) 1px, transparent 1.5px) !important;
  background-size: 8px 8px !important;
}
.dark [data-workspace-area="conversation"] {
  background-image: radial-gradient(rgba(148, 176, 194, 0.10) 1px, transparent 1.5px) !important;
  background-size: 8px 8px !important;
}

/* Chunky square scrollbars. */
::-webkit-scrollbar { width: 12px; height: 12px; }
:root:not(.dark) ::-webkit-scrollbar-thumb { background: #94b0c2; border: 2px solid #eef2f5; border-radius: 0; }
.dark ::-webkit-scrollbar-thumb { background: #333c57; border: 2px solid #1a1c2c; border-radius: 0; }

/* Links and the "Working" status: cyan in the dungeon, deep teal in daylight. */
:root:not(.dark) { --info: #257179 !important; --info-foreground: #1d5f66 !important; }
.dark { --info: #73eff7 !important; --info-foreground: #73eff7 !important; }
:root:not(.dark) ::selection { background: #ffcd75; color: #1a1c2c; }
.dark ::selection { background: #3b5dc9; color: #f4f4f4; }
</style>
</head>
<body class="dark">
<div class="shell" data-chat-canvas data-chat-column>
  <aside data-slot="sidebar-wrapper" data-slot="sidebar">
    <div data-slot="sidebar-inner">
      <div class="brand"><span data-slot="project-monogram">T3</span> Code</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row class="on">Pixel Quest</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row>Appearance</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row>Fix HTTPS</div>
    </div>
  </aside>
  <main data-workspace-area="conversation" data-chat-column>
    <header data-chat-header>
      <span>Pixel Quest</span>
      <span data-chat-provider-model-picker data-model-picker-content>Opus 5.5 <span class="dot"></span></span>
    </header>
    <div class="msgs">
      <div data-message-role="assistant">This is a live mock of T3 Code wearing <strong>Pixel Quest</strong>. Animated CSS in the skin should play here.</div>
      <div data-user-message-bubble>Restyle the app and keep the sidebar readable.</div>
      <div data-message-role="assistant">Done. Palette plus custom CSS are applied. Try <code>Settings → Appearance → Add</code>.</div>
    </div>
    <form data-chat-composer-form data-slot="composer-host" data-slot="composer-shell">
      <div data-slot="input" data-chat-composer-main-surface>Ask T3 Code…</div>
      <button type="button" data-slot="button">Send</button>
    </form>
  </main>
</div>
</body>
</html>

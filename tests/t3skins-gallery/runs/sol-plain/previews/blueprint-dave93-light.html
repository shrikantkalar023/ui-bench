<!DOCTYPE html>
<html lang="en" class="" data-theme-id="preview" data-theme-selected="true" style="--app-theme-canvas:#f3f0e6;--app-theme-chrome:#f3f0e6;--app-theme-toolbar:#f3f0e6;--app-theme-toolbar-foreground:#14304f;--app-theme-toolbar-border:#d6d0bf;--app-theme-toolbar-control:#faf8f2;--app-theme-toolbar-control-foreground:#14304f;--app-theme-toolbar-control-hover:#ebe7da;--app-theme-surface:#fbf9f3;--app-theme-surface-raised:#f7f4ec;--app-theme-surface-overlay:#fbf9f3;--app-theme-text:#14304f;--app-theme-text-muted:#4d6680;--app-theme-border:#d6d0bf;--app-theme-input:#c9c2ae;--app-theme-focus:#1d4e89;--app-theme-accent:#1d4e89;--app-theme-accent-foreground:#ffffff;--app-theme-secondary:#ece8dc;--app-theme-secondary-foreground:#14304f;--app-theme-muted:#ece8dc;--app-theme-muted-foreground:#4d6680;--app-theme-placeholder:#6f8399;--app-theme-secondary-label:#4d6680;--app-theme-icon-muted:#627891;--app-theme-error:#c8372d;--app-theme-error-foreground:#a8291f;--app-theme-error-surface:#f8e4df;--app-theme-warning:#d98b00;--app-theme-warning-foreground:#8f5a00;--app-theme-warning-surface:#f6ecd6;--app-theme-update:#1d4e89;--app-theme-update-foreground:#1d4e89;--app-theme-update-surface:#dde6f0;--app-theme-accent-surface:#dde6f0;--app-theme-accent-surface-foreground:#123a66;--app-theme-message-surface:#e2e8ee;--app-theme-message-foreground:#14304f;--app-theme-message-action:#1d4e89;--app-theme-message-action-foreground:#ffffff;--app-theme-message-action-hover:#173f70;--app-theme-code-background:#ece8dc;--app-theme-code-foreground:#14304f;--app-theme-search-match-background:#ffde8b;--app-theme-search-match-foreground:#21180a;--app-theme-search-match-active-background:#eea52b;--app-theme-search-match-active-foreground:#21180a;--app-theme-sidebar:#ebe7da;--app-theme-sidebar-foreground:#14304f;--app-theme-sidebar-muted-foreground:#4d6680;--app-theme-sidebar-control-surface:#e3decf;--app-theme-sidebar-row-hover:#e3decf;--app-theme-sidebar-row-active:#dcd6c6;--app-theme-sidebar-row-selected:#faf8f2;--app-theme-sidebar-border:#d6d0bf;--app-theme-terminal-background:#f3f0e6;--app-theme-terminal-foreground:#14304f;--app-theme-terminal-cursor:#1d4e89;--app-theme-terminal-selection:#cfdbe8;--app-theme-terminal-scrollbar:#d6d0bf;--app-theme-terminal-scrollbar-hover:#c2bba7;color-scheme:light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Blueprint preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--app-theme-canvas,#111);color:var(--app-theme-text,#eee);
  font:12px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
.shell{display:grid;grid-template-columns:124px 1fr;height:100%;min-height:100%;
  background:var(--app-theme-canvas,#111);color:var(--app-theme-text,#eee)}
[data-slot="sidebar-wrapper"],[data-slot="sidebar"]{
  background:var(--app-theme-sidebar,var(--app-theme-chrome,#0c0c0e));
  color:var(--app-theme-sidebar-foreground,var(--app-theme-text,#eee));
  border-right:1px solid var(--app-theme-sidebar-border,var(--app-theme-border,#222));
  padding:10px 8px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
[data-slot="sidebar-inner"]{display:flex;flex-direction:column;gap:6px;min-height:0}
.brand{display:flex;align-items:center;gap:6px;font-weight:650;letter-spacing:-.02em}
[data-slot="project-monogram"]{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;
  background:var(--app-theme-accent,#7aa2f7);color:var(--app-theme-accent-foreground,#111);font-size:9px;font-weight:700}
[data-thread-item],[data-testid="sidebar-row-card"],[data-sidebar-row]{
  padding:6px 8px;border-radius:8px;color:var(--app-theme-sidebar-muted-foreground,var(--app-theme-muted-foreground,#9a9));
  background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-thread-item].on,[data-sidebar-row].on{
  background:var(--app-theme-sidebar-row-active,var(--app-theme-sidebar-row-selected,var(--app-theme-muted,#222)));
  color:var(--app-theme-sidebar-foreground,var(--app-theme-text))}
[data-workspace-area="conversation"],[data-chat-column]{
  display:flex;flex-direction:column;min-width:0;height:100%;
  background:var(--app-theme-canvas,#111);position:relative}
[data-chat-header]{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid var(--app-theme-toolbar-border,var(--app-theme-border,#222));
  background:var(--app-theme-toolbar,transparent);color:var(--app-theme-toolbar-foreground,var(--app-theme-text));
  position:relative;z-index:2}
.msgs{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;min-height:0}
[data-message-role="assistant"]{max-width:86%;color:var(--app-theme-text);opacity:.95}
[data-user-message-bubble]{align-self:flex-end;max-width:78%;padding:7px 10px;border-radius:12px 12px 4px 12px;
  background:var(--app-theme-message-surface,var(--app-theme-surface,#222));
  color:var(--app-theme-message-foreground,var(--app-theme-text))}
code,pre{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--app-theme-code-background,var(--app-theme-surface,#1a1a1a));
  color:var(--app-theme-code-foreground,var(--app-theme-text));border-radius:6px;padding:1px 4px}
[data-slot="composer-host"],[data-chat-composer-form],[data-slot="composer-shell"]{
  margin:8px;padding:8px 10px;border:1px solid var(--app-theme-border,#222);
  border-radius:12px;background:var(--app-theme-surface,var(--app-theme-input,#1a1a1a));
  display:flex;align-items:center;gap:8px;position:relative;z-index:2}
[data-slot="input"],[data-chat-composer-main-surface]{flex:1;color:var(--app-theme-placeholder,var(--app-theme-text-muted,#888));}
[data-slot="button"]{border:0;border-radius:8px;padding:5px 10px;cursor:default;font-weight:650;
  background:var(--app-theme-message-action,var(--app-theme-accent,#7aa2f7));
  color:var(--app-theme-message-action-foreground,var(--app-theme-accent-foreground,#111))}
.dot{width:6px;height:6px;border-radius:99px;background:var(--app-theme-accent);display:inline-block}

html,body{background:#f3f0e6}
/* Drafting grid behind the chat: a 16px minor grid and a 96px major grid, drawn with gradients. */
:root:not(.dark) [data-workspace-area="conversation"] {
  background-image:
    linear-gradient(rgba(29, 78, 137, 0.11) 1px, transparent 1px),
    linear-gradient(90deg, rgba(29, 78, 137, 0.11) 1px, transparent 1px),
    linear-gradient(rgba(29, 78, 137, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(29, 78, 137, 0.045) 1px, transparent 1px) !important;
  background-size: 96px 96px, 96px 96px, 16px 16px, 16px 16px !important;
}
.dark [data-workspace-area="conversation"] {
  background-image:
    linear-gradient(rgba(233, 241, 248, 0.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(233, 241, 248, 0.09) 1px, transparent 1px),
    linear-gradient(rgba(233, 241, 248, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(233, 241, 248, 0.035) 1px, transparent 1px) !important;
  background-size: 96px 96px, 96px 96px, 16px 16px, 16px 16px !important;
}

/* Title-block lettering. */
[data-slot="sidebar"], [data-chat-header] { font-family: var(--font-mono, ui-monospace, monospace); letter-spacing: -0.01em; }
.chat-markdown :is(h1, h2, h3) { font-family: var(--font-mono, ui-monospace, monospace); text-transform: uppercase; letter-spacing: 0.05em; }

/* Drafting lines: near-square corners, dashed frames on code, square-capped icons. */
[data-slot="composer-host"], .chat-markdown-codeblock, [data-user-message-bubble] { border-radius: 2px !important; }
.chat-markdown-codeblock { border-style: dashed !important; }
svg.lucide { stroke-width: 1.5; stroke-linecap: square; stroke-linejoin: miter; }
:root:not(.dark) [data-user-message-bubble] { box-shadow: inset 2px 0 0 #1d4e89; }
.dark [data-user-message-bubble] { box-shadow: inset 2px 0 0 #ffd25a; }

/* Links take the accent; --info (the "Working" status) moves off the ground's own blue. */
:root:not(.dark) { --info: #2a5f9e !important; --info-foreground: #2a5f9e !important; }
.dark { --info: #8cc8ff !important; --info-foreground: #8cc8ff !important; }
:root:not(.dark) :is(.chat-markdown, [data-user-message-bubble]) a:not(.chat-markdown-file-link) { color: #1d4e89 !important; }
.dark :is(.chat-markdown, [data-user-message-bubble]) a:not(.chat-markdown-file-link) { color: #ffd25a !important; }
:root:not(.dark) ::selection { background: #cfdbe8; color: #14304f; }
.dark ::selection { background: #5b5530; color: #fffbe8; }
</style>
</head>
<body class="">
<div class="shell" data-chat-canvas data-chat-column>
  <aside data-slot="sidebar-wrapper" data-slot="sidebar">
    <div data-slot="sidebar-inner">
      <div class="brand"><span data-slot="project-monogram">T3</span> Code</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row class="on">Blueprint</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row>Appearance</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row>Fix HTTPS</div>
    </div>
  </aside>
  <main data-workspace-area="conversation" data-chat-column>
    <header data-chat-header>
      <span>Blueprint</span>
      <span data-chat-provider-model-picker data-model-picker-content>Opus 5.5 <span class="dot"></span></span>
    </header>
    <div class="msgs">
      <div data-message-role="assistant">This is a live mock of T3 Code wearing <strong>Blueprint</strong>. Animated CSS in the skin should play here.</div>
      <div data-user-message-bubble>Restyle the app and keep the sidebar readable.</div>
      <div data-message-role="assistant">Done. Palette plus custom CSS are applied. Try <code>Settings → Appearance → Add</code>.</div>
    </div>
    <form data-chat-composer-form data-slot="composer-host" data-slot="composer-shell">
      <div data-slot="input" data-chat-composer-main-surface>Ask T3 Code…</div>
      <button type="button" data-slot="button">Send</button>
    </form>
  </main>
</div>
</body>
</html>

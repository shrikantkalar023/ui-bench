<!DOCTYPE html>
<html lang="en" class="dark" data-theme-id="preview" data-theme-selected="true" style="--app-theme-canvas:#151a19;--app-theme-chrome:#111615;--app-theme-toolbar:#151a19;--app-theme-toolbar-foreground:#c6cfcb;--app-theme-toolbar-border:#252d2b;--app-theme-toolbar-control:#1b2120;--app-theme-toolbar-control-foreground:#d0d7d3;--app-theme-toolbar-control-hover:#232b29;--app-theme-surface:#191f1e;--app-theme-surface-raised:#1e2524;--app-theme-surface-overlay:#222a28;--app-theme-text:#dde3df;--app-theme-text-muted:#8e9a96;--app-theme-border:#29312f;--app-theme-input:#323b39;--app-theme-focus:#82c3b4;--app-theme-accent:#82c3b4;--app-theme-accent-foreground:#0b1b17;--app-theme-secondary:#222a28;--app-theme-secondary-foreground:#d0d7d3;--app-theme-muted:#1b2120;--app-theme-muted-foreground:#8a9692;--app-theme-placeholder:#727e7a;--app-theme-secondary-label:#9ea9a5;--app-theme-icon-muted:#75827d;--app-theme-error:#e38d86;--app-theme-error-foreground:#230c0a;--app-theme-error-surface:#2e1c1a;--app-theme-warning:#d9a377;--app-theme-warning-foreground:#221306;--app-theme-warning-surface:#2c231a;--app-theme-update:#8fb2d8;--app-theme-update-foreground:#0a1522;--app-theme-update-surface:#1a2530;--app-theme-accent-surface:#1a2d29;--app-theme-accent-surface-foreground:#a5d8cb;--app-theme-message-surface:#1f2625;--app-theme-message-foreground:#dde3df;--app-theme-message-action:#262e2c;--app-theme-message-action-foreground:#c9d1cd;--app-theme-message-action-hover:#2e3735;--app-theme-code-background:#101514;--app-theme-code-foreground:#d0d7d3;--app-theme-search-match-background:#523a24;--app-theme-search-match-foreground:#f6e7d6;--app-theme-search-match-active-background:#d9a377;--app-theme-search-match-active-foreground:#221306;--app-theme-sidebar:#111615;--app-theme-sidebar-foreground:#c0c9c5;--app-theme-sidebar-muted-foreground:#87938f;--app-theme-sidebar-control-surface:#181e1d;--app-theme-sidebar-row-hover:#181e1d;--app-theme-sidebar-row-active:#1d2423;--app-theme-sidebar-row-selected:#1a2925;--app-theme-sidebar-border:#1c2221;--app-theme-terminal-background:#101514;--app-theme-terminal-foreground:#d0d7d3;--app-theme-terminal-cursor:#82c3b4;--app-theme-terminal-selection:#26403a;--app-theme-terminal-scrollbar:#2b3432;--app-theme-terminal-scrollbar-hover:#3a4543;color-scheme:dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Verdigris preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--app-theme-canvas,#111);color:var(--app-theme-text,#eee);
  font:12px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
.shell{display:grid;grid-template-columns:124px 1fr;height:100%;min-height:100%;
  background:var(--app-theme-canvas,#111);color:var(--app-theme-text,#eee)}
[data-slot="sidebar-wrapper"],[data-slot="sidebar"]{
  background:var(--app-theme-sidebar,var(--app-theme-chrome,#0c0c0e));
  color:var(--app-theme-sidebar-foreground,var(--app-theme-text,#eee));
  border-right:1px solid var(--app-theme-sidebar-border,var(--app-theme-border,#222));
  padding:10px 8px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
[data-slot="sidebar-inner"]{display:flex;flex-direction:column;gap:6px;min-height:0}
.brand{display:flex;align-items:center;gap:6px;font-weight:650;letter-spacing:-.02em}
[data-slot="project-monogram"]{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;
  background:var(--app-theme-accent,#7aa2f7);color:var(--app-theme-accent-foreground,#111);font-size:9px;font-weight:700}
[data-thread-item],[data-testid="sidebar-row-card"],[data-sidebar-row]{
  padding:6px 8px;border-radius:8px;color:var(--app-theme-sidebar-muted-foreground,var(--app-theme-muted-foreground,#9a9));
  background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-thread-item].on,[data-sidebar-row].on{
  background:var(--app-theme-sidebar-row-active,var(--app-theme-sidebar-row-selected,var(--app-theme-muted,#222)));
  color:var(--app-theme-sidebar-foreground,var(--app-theme-text))}
[data-workspace-area="conversation"],[data-chat-column]{
  display:flex;flex-direction:column;min-width:0;height:100%;
  background:var(--app-theme-canvas,#111);position:relative}
[data-chat-header]{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid var(--app-theme-toolbar-border,var(--app-theme-border,#222));
  background:var(--app-theme-toolbar,transparent);color:var(--app-theme-toolbar-foreground,var(--app-theme-text));
  position:relative;z-index:2}
.msgs{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;min-height:0}
[data-message-role="assistant"]{max-width:86%;color:var(--app-theme-text);opacity:.95}
[data-user-message-bubble]{align-self:flex-end;max-width:78%;padding:7px 10px;border-radius:12px 12px 4px 12px;
  background:var(--app-theme-message-surface,var(--app-theme-surface,#222));
  color:var(--app-theme-message-foreground,var(--app-theme-text))}
code,pre{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--app-theme-code-background,var(--app-theme-surface,#1a1a1a));
  color:var(--app-theme-code-foreground,var(--app-theme-text));border-radius:6px;padding:1px 4px}
[data-slot="composer-host"],[data-chat-composer-form],[data-slot="composer-shell"]{
  margin:8px;padding:8px 10px;border:1px solid var(--app-theme-border,#222);
  border-radius:12px;background:var(--app-theme-surface,var(--app-theme-input,#1a1a1a));
  display:flex;align-items:center;gap:8px;position:relative;z-index:2}
[data-slot="input"],[data-chat-composer-main-surface]{flex:1;color:var(--app-theme-placeholder,var(--app-theme-text-muted,#888));}
[data-slot="button"]{border:0;border-radius:8px;padding:5px 10px;cursor:default;font-weight:650;
  background:var(--app-theme-message-action,var(--app-theme-accent,#7aa2f7));
  color:var(--app-theme-message-action-foreground,var(--app-theme-accent-foreground,#111))}
.dot{width:6px;height:6px;border-radius:99px;background:var(--app-theme-accent);display:inline-block}

html,body{background:#151a19}
/* Verdigris: stone and copper patina. Only T3's documented stable selectors. */
:root {
  --vg-sans: "Inter Variable", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --vg-mono: "CommitMono", "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, monospace;
  /* T3's own font tokens: the rest of the UI follows without per-element rules. */
  --font-sans: var(--vg-sans);
  --font-mono: var(--vg-mono);
}
:root:not(.dark) {
  --vg-accent: #2c6e64; --vg-copper: #8f5226; --vg-line: #dddfd7; --vg-line-soft: #e6e8e1;
  --vg-ink: #1e2523; --vg-quiet: #5c6763; --vg-chip: #e6e8e1;
  --vg-wash: rgba(44, 110, 100, 0.045);
  --vg-shadow: 0 1px 2px rgba(30, 40, 36, 0.05), 0 10px 28px -6px rgba(30, 40, 36, 0.10);
  --vg-lift: 0 1px 2px rgba(30, 40, 36, 0.04), 0 4px 14px -4px rgba(30, 40, 36, 0.07);
}
.dark {
  --vg-accent: #82c3b4; --vg-copper: #d9a377; --vg-line: #29312f; --vg-line-soft: #212827;
  --vg-ink: #dde3df; --vg-quiet: #8e9a96; --vg-chip: #232b29;
  --vg-wash: rgba(130, 195, 180, 0.035);
  --vg-shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 14px 34px -8px rgba(0, 0, 0, 0.45);
  --vg-lift: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px -6px rgba(0, 0, 0, 0.35);
}

::selection { background: color-mix(in srgb, var(--vg-accent) 26%, transparent); }

/* Conversation: a barely-there patina wash behind the first messages. */
[data-workspace-area="conversation"] {
  background-image: linear-gradient(180deg, var(--vg-wash), transparent 320px);
}
[data-chat-header] { border-bottom: 1px solid var(--vg-line-soft) !important; }

/* Prose */
.chat-markdown, .composer-tiptap, [data-user-message-bubble] {
  font-family: var(--vg-sans);
  font-feature-settings: "calt", "cv05", "ss03";
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
.chat-markdown { line-height: 1.65; letter-spacing: -0.003em; }
.composer-tiptap { line-height: 1.6; }
.chat-markdown h1, .chat-markdown h2, .chat-markdown h3, .chat-markdown h4 {
  font-weight: 600; letter-spacing: -0.014em; line-height: 1.3;
}
.chat-markdown strong { font-weight: 600; }
.chat-markdown a {
  color: var(--vg-accent);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--vg-accent) 35%, transparent);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  transition: text-decoration-color 140ms ease;
}
.chat-markdown a:hover { text-decoration-color: var(--vg-accent); }
.chat-markdown blockquote {
  border-left: 2px solid color-mix(in srgb, var(--vg-accent) 45%, transparent);
  color: var(--vg-quiet);
}
.chat-markdown hr { border-color: var(--vg-line-soft); }
.chat-markdown thead th { font-weight: 600; color: var(--vg-quiet); }

/* Code */
.chat-markdown code, .chat-markdown pre, .chat-markdown-codeblock, .composer-tiptap code {
  font-family: var(--vg-mono) !important;
  font-feature-settings: normal;
  font-variant-ligatures: none;
  letter-spacing: 0;
}
.chat-markdown :not(pre) > code {
  font-size: 0.875em;
  padding: 0.12em 0.36em;
  border-radius: 5px;
  border: 1px solid var(--vg-line-soft);
  background: var(--vg-chip);
}
.chat-markdown pre { line-height: 1.55; font-size: 0.86em; }
.chat-markdown-codeblock {
  border: 1px solid var(--vg-line) !important;
  border-radius: 10px !important;
  overflow: hidden;
}

/* Messages */
[data-user-message-bubble] {
  border: 1px solid var(--vg-line-soft) !important;
  border-radius: 14px !important;
  line-height: 1.6;
}

/* Quoted response in a user message: a pull quote with a patina rail.
   Not on T3's stable list: the card is the bubble's link with data-thread-find-ignore. */
[data-user-message-bubble] a[data-thread-find-ignore] {
  background: var(--vg-wash) !important;
  border-left: 2px solid color-mix(in srgb, var(--vg-accent) 55%, transparent);
  border-radius: 2px 8px 8px 2px !important;
  padding: 7px 12px 8px !important;
  font-size: 0.8125rem !important;
  line-height: 1.55;
  color: var(--vg-quiet) !important;
  transition: background-color 140ms ease, border-color 140ms ease;
}
[data-user-message-bubble] a[data-thread-find-ignore]:hover {
  background: color-mix(in srgb, var(--vg-accent) 9%, transparent) !important;
  border-left-color: var(--vg-accent);
}
[data-user-message-bubble] a[data-thread-find-ignore] mark {
  background: color-mix(in srgb, var(--vg-accent) 14%, transparent) !important;
  color: var(--vg-ink) !important;
  border-radius: 3px;
  padding: 1px 3px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}

/* Composer: a quiet floating card; the edge turns to patina on focus. */
[data-slot="composer-host"] {
  border-radius: 16px !important;
  box-shadow: var(--vg-lift);
  transition: box-shadow 180ms ease, border-color 180ms ease;
}
[data-slot="composer-host"]:focus-within {
  border-color: color-mix(in srgb, var(--vg-accent) 50%, var(--vg-line)) !important;
  box-shadow: var(--vg-lift), 0 0 0 3px color-mix(in srgb, var(--vg-accent) 12%, transparent);
}

/* Sidebar: the open thread gets a short patina tick, not a full bar. */
[data-thread-item] [aria-current]:not([aria-current="false"]) {
  background-image: linear-gradient(var(--vg-accent), var(--vg-accent));
  background-repeat: no-repeat;
  background-size: 2px 52%;
  background-position: left center;
  font-weight: 500;
}
[data-slot="project-monogram"] svg { border-radius: 6px; }

/* Cards and floating surfaces: hairline plus one soft shadow. */
[data-thread-details-card] {
  border-radius: 12px !important;
  border-color: var(--vg-line) !important;
}
[data-slot="menu-popup"], [data-slot="popover-popup"], [data-slot="dialog-popup"] {
  border: 1px solid var(--vg-line) !important;
  box-shadow: var(--vg-shadow) !important;
}
[data-slot="menu-popup"], [data-slot="popover-popup"] { border-radius: 10px !important; }
[data-slot="dialog-popup"] { border-radius: 14px !important; }
[data-slot="tooltip-popup"] { border-radius: 6px !important; letter-spacing: 0.005em; }
[data-thread-terminal-drawer] { border-top: 1px solid var(--vg-line) !important; }

/* Controls */
[data-slot="button"] { border-radius: 8px; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
[data-slot="input"], [data-slot="select-trigger"] { border-radius: 8px; }
[data-slot="input"]:focus-visible, [data-slot="select-trigger"]:focus-visible {
  border-color: color-mix(in srgb, var(--vg-accent) 55%, var(--vg-line)) !important;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--vg-accent) 14%, transparent) !important;
  outline: none;
}
:focus-visible { outline-color: color-mix(in srgb, var(--vg-accent) 70%, transparent); }
svg.lucide { stroke-width: 1.6; }

/* Scrollbars: thin and neutral, patina only while hovered. */
[data-slot="scroll-area-thumb"] { border-radius: 999px; }
[data-slot="scroll-area-scrollbar"]:hover [data-slot="scroll-area-thumb"] {
  background: color-mix(in srgb, var(--vg-accent) 45%, transparent) !important;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: color-mix(in srgb, var(--vg-quiet) 30%, transparent);
  border: 3px solid transparent; background-clip: padding-box; border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--vg-accent) 50%, transparent); }

@media (prefers-reduced-motion: reduce) {
  [data-slot="composer-host"], [data-slot="button"], .chat-markdown a { transition: none; }
}

</style>
</head>
<body class="dark">
<div class="shell" data-chat-canvas data-chat-column>
  <aside data-slot="sidebar-wrapper" data-slot="sidebar">
    <div data-slot="sidebar-inner">
      <div class="brand"><span data-slot="project-monogram">T3</span> Code</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row class="on">Verdigris</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row>Appearance</div>
      <div data-thread-item data-testid="sidebar-row-card" data-sidebar-row>Fix HTTPS</div>
    </div>
  </aside>
  <main data-workspace-area="conversation" data-chat-column>
    <header data-chat-header>
      <span>Verdigris</span>
      <span data-chat-provider-model-picker data-model-picker-content>Opus 5.5 <span class="dot"></span></span>
    </header>
    <div class="msgs">
      <div data-message-role="assistant">This is a live mock of T3 Code wearing <strong>Verdigris</strong>. Animated CSS in the skin should play here.</div>
      <div data-user-message-bubble>Restyle the app and keep the sidebar readable.</div>
      <div data-message-role="assistant">Done. Palette plus custom CSS are applied. Try <code>Settings → Appearance → Add</code>.</div>
    </div>
    <form data-chat-composer-form data-slot="composer-host" data-slot="composer-shell">
      <div data-slot="input" data-chat-composer-main-surface>Ask T3 Code…</div>
      <button type="button" data-slot="button">Send</button>
    </form>
  </main>
</div>
</body>
</html>

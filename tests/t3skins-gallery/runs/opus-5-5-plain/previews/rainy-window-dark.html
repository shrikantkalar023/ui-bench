*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--app-theme-canvas,#111);color:var(--app-theme-text,#eee);
  font:12px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
.shell{display:grid;grid-template-columns:124px 1fr;height:100%;min-height:100%;
  background:var(--app-theme-canvas,#111);color:var(--app-theme-text,#eee)}
[data-slot="sidebar-wrapper"],[data-slot="sidebar"]{
  background:var(--app-theme-sidebar,var(--app-theme-chrome,#0c0c0e));
  color:var(--app-theme-sidebar-foreground,var(--app-theme-text,#eee));
  border-right:1px solid var(--app-theme-sidebar-border,var(--app-theme-border,#222));
  padding:10px 8px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
[data-slot="sidebar-inner"]{display:flex;flex-direction:column;gap:6px;min-height:0}
.brand{display:flex;align-items:center;gap:6px;font-weight:650;letter-spacing:-.02em}
[data-slot="project-monogram"]{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;
  background:var(--app-theme-accent,#7aa2f7);color:var(--app-theme-accent-foreground,#111);font-size:9px;font-weight:700}
[data-thread-item],[data-testid="sidebar-row-card"],[data-sidebar-row]{
  padding:6px 8px;border-radius:8px;color:var(--app-theme-sidebar-muted-foreground,var(--app-theme-muted-foreground,#9a9));
  background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-thread-item].on,[data-sidebar-row].on{
  background:var(--app-theme-sidebar-row-active,var(--app-theme-sidebar-row-selected,var(--app-theme-muted,#222)));
  color:var(--app-theme-sidebar-foreground,var(--app-theme-text))}
[data-workspace-area="conversation"],[data-chat-column]{
  display:flex;flex-direction:column;min-width:0;height:100%;
  background:var(--app-theme-canvas,#111);position:relative}
[data-chat-header]{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid var(--app-theme-toolbar-border,var(--app-theme-border,#222));
  background:var(--app-theme-toolbar,transparent);color:var(--app-theme-toolbar-foreground,var(--app-theme-text));
  position:relative;z-index:2}
.msgs{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;min-height:0}
[data-message-role="assistant"]{max-width:86%;color:var(--app-theme-text);opacity:.95}
[data-user-message-bubble]{align-self:flex-end;max-width:78%;padding:7px 10px;border-radius:12px 12px 4px 12px;
  background:var(--app-theme-message-surface,var(--app-theme-surface,#222));
  color:var(--app-theme-message-foreground,var(--app-theme-text))}
code,pre{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--app-theme-code-background,var(--app-theme-surface,#1a1a1a));
  color:var(--app-theme-code-foreground,var(--app-theme-text));border-radius:6px;padding:1px 4px}
[data-slot="composer-host"],[data-chat-composer-form],[data-slot="composer-shell"]{
  margin:8px;padding:8px 10px;border:1px solid var(--app-theme-border,#222);
  border-radius:12px;background:var(--app-theme-surface,var(--app-theme-input,#1a1a1a));
  display:flex;align-items:center;gap:8px;position:relative;z-index:2}
[data-slot="input"],[data-chat-composer-main-surface]{flex:1;color:var(--app-theme-placeholder,var(--app-theme-text-muted,#888));}
[data-slot="button"]{border:0;border-radius:8px;padding:5px 10px;cursor:default;font-weight:650;
  background:var(--app-theme-message-action,var(--app-theme-accent,#7aa2f7));
  color:var(--app-theme-message-action-foreground,var(--app-theme-accent-foreground,#111))}
.dot{width:6px;height:6px;border-radius:99px;background:var(--app-theme-accent);display:inline-block}
